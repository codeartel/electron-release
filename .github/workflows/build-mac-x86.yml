name: Build macOS x86

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag：留空则用 v<package.json version>（已存在则覆盖同名附件）'
        type: string
        required: false
        default: ''
      upload_artifact:
        description: '额外上传 Actions artifact 作为兜底（占用账号级 artifact 存储额度，默认关闭）'
        type: boolean
        default: false

permissions:
  # 产物发布到 GitHub Release 需要写入权限
  contents: write

jobs:
  build-mac-x86:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Import code signing certificate
        if: env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # 创建临时目录
          mkdir -p /tmp/certs
          
          # 解码证书（如果证书是 base64 编码的）
          echo "$CSC_LINK" | base64 --decode > /tmp/certs/cert.p12
          
          # 创建钥匙串
          security create-keychain -p "$CSC_KEY_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CSC_KEY_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # 导入证书到钥匙串
          security import /tmp/certs/cert.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          
          # 允许访问证书
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEY_PASSWORD" build.keychain
          
          # 列出证书（用于调试）
          security find-identity -v -p codesigning build.keychain
          
          # 清理临时文件
          rm -rf /tmp/certs

      - name: Install dependencies
        run: npm ci

      - name: Prepare cache key
        id: versions
        run: |
          set -euo pipefail
          electron=$(node -p 'require("./node_modules/electron/package.json").version')
          muhammara=$(sed -n "s/.*MUHAMMARA_VERSION = '\([^']*\)'.*/\1/p" scripts/build-muhammara.mjs | head -1)
          test -n "$electron" && test -n "$muhammara"
          echo "electron=$electron" >> "$GITHUB_OUTPUT"
          echo "muhammara=$muhammara" >> "$GITHUB_OUTPUT"
          echo "cache-key=muhammara-${{ runner.os }}-${{ runner.arch }}-electron-${electron}-muhammara-${muhammara}-script-${{ hashFiles('scripts/build-muhammara.mjs') }}-wrapper-${{ hashFiles('scripts/build-native.mjs') }}" >> "$GITHUB_OUTPUT"

      # 仅恢复缓存；保存统一由编译成功后的 Save 步骤负责（save-always 已废弃且行为不符预期）
      - name: Restore muhammara binding
        id: cache-binding
        uses: actions/cache/restore@v5
        with:
          path: |
            native/muhammara/binding.node
            .native-build/stamp.json
          key: ${{ steps.versions.outputs.cache-key }}

      # 指纹命中（缓存标记与当前 Electron / muhammara / 构建脚本一致）时自动跳过编译，未命中或产物缺失时重编译
      - name: Build muhammara binding
        id: build-binding
        run: node scripts/build-native.mjs

      # 编译成功后立即保存缓存（不等整个 job 成功），避免后续签名/打包失败导致下次运行重新编译
      - name: Save muhammara binding
        if: always() && steps.cache-binding.outputs.cache-hit != 'true' && steps.build-binding.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            native/muhammara/binding.node
            .native-build/stamp.json
          key: ${{ steps.versions.outputs.cache-key }}

      - name: Build macOS x64
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64

      # 产物走 GitHub Release：Release 附件不计入 Actions artifact 存储额度，
      # 而 artifact 额度是账号级共享的，一旦超额会让上传步骤失败、整轮打包无产出。
      # 两个 mac 架构各自生成同名 latest-mac.yml，同名附件会互相覆盖，故按架构改名；
      # 同步到更新源 file.slinote.com/installer/mac 时再改回 latest-mac.yml
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # tag 推送取推送的 tag；手动触发取输入值，留空回落到 v<版本号>
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "发布目标 tag：$TAG"
          mkdir -p publish
          cp release/*.dmg release/*.zip release/*.dmg.blockmap release/*.zip.blockmap publish/
          cp release/latest-mac.yml publish/latest-mac-x64.yml
          # 四个平台工作流会并行给同一 tag 建草稿 Release，已存在（422）时忽略创建失败；
          # tag 不存在时从本次构建的 commit 建（--target），避免指向默认分支最新提交
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$TAG" --notes "自动打包产物（草稿，确认后发布）" || true
          gh release upload "$TAG" publish/* --repo "$GITHUB_REPOSITORY" --clobber

      # 兜底通道：默认关闭（不再占用 artifact 额度），需要临时取件时手动触发并勾选；
      # 额度仍被占满时由 continue-on-error 兜住，不影响整轮打包结论
      - name: Upload artifacts (optional fallback)
        if: inputs.upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mac-x64
          path: |
            release/*.dmg
            release/*.zip
            release/*.dmg.blockmap
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
