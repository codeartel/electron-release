name: Build macOS ARM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac-arm:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Import code signing certificate
        if: env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # 创建临时目录
          mkdir -p /tmp/certs
          
          # 解码证书（如果证书是 base64 编码的）
          echo "$CSC_LINK" | base64 --decode > /tmp/certs/cert.p12
          
          # 创建钥匙串
          security create-keychain -p "$CSC_KEY_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CSC_KEY_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # 导入证书到钥匙串
          security import /tmp/certs/cert.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          
          # 允许访问证书
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEY_PASSWORD" build.keychain
          
          # 列出证书（用于调试）
          security find-identity -v -p codesigning build.keychain
          
          # 清理临时文件
          rm -rf /tmp/certs

      - name: Install dependencies
        run: npm ci

      - name: Build macOS ARM64
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-arm64
          path: |
            release/*arm64*.dmg
            release/*arm64*.zip
            release/*arm64*.dmg.blockmap
            release/*arm64*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: ignore

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
