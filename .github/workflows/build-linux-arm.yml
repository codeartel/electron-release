name: Build Linux ARM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag：留空则用 v<package.json version>（已存在则覆盖同名附件）'
        type: string
        required: false
        default: ''
      upload_artifact:
        description: '额外上传 Actions artifact 作为兜底（占用账号级 artifact 存储额度，默认关闭）'
        type: boolean
        default: false

permissions:
  # 产物发布到 GitHub Release 需要写入权限
  contents: write

env:
  # muhammara binding 的编译镜像：debian bullseye（glibc 2.31）。
  # 直接用 ubuntu-24.04-arm（glibc 2.39）现编会让产物硬依赖 GLIBC_2.38，
  # Ubuntu 22.04 / Debian 12 / UOS 等用户加载该模块直接失败 → PDF 导出无文件。
  # 同时保证 libstdc++ 下限不高于 6.0.28（Ubuntu 20.04 自带版本）。
  MUHAMMARA_BUILD_CONTAINER: node:20-bullseye

jobs:
  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare cache key
        id: versions
        run: |
          set -euo pipefail
          electron=$(node -p 'require("./node_modules/electron/package.json").version')
          muhammara=$(sed -n "s/.*MUHAMMARA_VERSION = '\([^']*\)'.*/\1/p" scripts/build-muhammara.mjs | head -1)
          test -n "$electron" && test -n "$muhammara"
          # 编译环境（容器镜像）必须参与缓存键：否则更换 glibc 基线后仍会命中旧的
          # GLIBC_2.38 产物，等于没改
          container=$(printf '%s' "${MUHAMMARA_BUILD_CONTAINER:-host}" | tr -c 'A-Za-z0-9._-' '-')
          echo "electron=$electron" >> "$GITHUB_OUTPUT"
          echo "muhammara=$muhammara" >> "$GITHUB_OUTPUT"
          echo "cache-key=muhammara-${{ runner.os }}-${{ runner.arch }}-electron-${electron}-muhammara-${muhammara}-container-${container}-script-${{ hashFiles('scripts/build-muhammara.mjs') }}-wrapper-${{ hashFiles('scripts/build-native.mjs') }}" >> "$GITHUB_OUTPUT"

      # 仅恢复缓存；保存统一由编译成功后的 Save 步骤负责（save-always 已废弃且行为不符预期）
      - name: Restore muhammara binding
        id: cache-binding
        uses: actions/cache/restore@v5
        with:
          path: |
            native/muhammara/binding.node
            .native-build/stamp.json
          key: ${{ steps.versions.outputs.cache-key }}

      # 指纹命中（缓存标记与当前 Electron / muhammara / 构建脚本一致）时自动跳过编译，未命中或产物缺失时重编译
      - name: Build muhammara binding
        id: build-binding
        run: node scripts/build-native.mjs
        env:
          SLINOTE_MUHAMMARA_CONTAINER: ${{ env.MUHAMMARA_BUILD_CONTAINER }}

      # 打包前守门：产物不得要求高于构建容器基线的 glibc，否则旧发行版加载即失败。
      # 必须在 Save cache 之前执行，避免不合规产物进入缓存
      - name: Verify glibc baseline
        run: |
          node scripts/check-glibc.mjs native/muhammara/binding.node --max=2.31
          node scripts/check-glibc.mjs native/history/binding.node --max=2.31

      # 编译成功后立即保存缓存（不等整个 job 成功），避免后续签名/打包失败导致下次运行重新编译
      - name: Save muhammara binding
        if: always() && steps.cache-binding.outputs.cache-hit != 'true' && steps.build-binding.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            native/muhammara/binding.node
            .native-build/stamp.json
          key: ${{ steps.versions.outputs.cache-key }}

      - name: Build Linux ARM64
        run: npx electron-builder --linux --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 产物走 GitHub Release：Release 附件不计入 Actions artifact 存储额度，
      # 而 artifact 额度是账号级共享的，一旦超额会让上传步骤失败、整轮打包无产出。
      # latest-linux-arm64.yml 本身已带架构，与 x64 的 latest-linux-x64.yml 不冲突
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # tag 推送取推送的 tag；手动触发取输入值，留空回落到 v<版本号>
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "发布目标 tag：$TAG"
          mkdir -p publish
          cp release/*.AppImage release/*.deb release/*.rpm publish/
          cp release/latest-linux-arm64.yml publish/
          # 四个平台工作流会并行给同一 tag 建草稿 Release，已存在（422）时忽略创建失败；
          # tag 不存在时从本次构建的 commit 建（--target），避免指向默认分支最新提交
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$TAG" --notes "自动打包产物（草稿，确认后发布）" || true
          gh release upload "$TAG" publish/* --repo "$GITHUB_REPOSITORY" --clobber

      # 兜底通道：默认关闭（不再占用 artifact 额度），需要临时取件时手动触发并勾选；
      # 额度仍被占满时由 continue-on-error 兜住，不影响整轮打包结论
      - name: Upload artifacts (optional fallback)
        if: inputs.upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest-linux-arm64.yml
          if-no-files-found: ignore
          retention-days: 3
